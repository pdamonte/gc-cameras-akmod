# Keep the IPU6 stack out of the initramfs so the patched ipu_bridge from
# /lib/modules/*/extra/gc-cameras is loaded after switch-root. Otherwise the
# in-tree ipu_bridge (without GCTI5035/GCTI8034) binds at boot and libcamera
# reports "No sensor found".
omit_drivers+=" ipu_bridge intel_ipu6 intel_ipu6_isys "
